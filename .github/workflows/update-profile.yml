raise RuntimeError(f'GitHub language query failed: {language_payload.get("errors", language_payload)}')
              repos = language_payload['data']['user']['repositories']
              for repo in repos.get('nodes', []):
                  for edge in repo['languages']['edges']:
                      name = edge['node']['name']
                      language_sizes[name] += edge['size']
                      language_colors[name] = edge['node'].get('color') or '#8b949e'
              page_info = repos['pageInfo']
              if not page_info['hasNextPage']:
                  break
              cursor = page_info['endCursor']

          ranked_languages = sorted(language_sizes.items(), key=lambda item: item[1], reverse=True)
          top_languages = ranked_languages[:10]
          total_language_bytes = sum(language_sizes.values())

          # The markup is generated locally, so the README image does not depend
          # on a rate-limited third-party statistics image endpoint.
          SVG_NS = 'http://www.w3.org/2000/svg'
          ET.register_namespace('', SVG_NS)
          def element(parent, tag, attrs=None, value=None):
              item = ET.SubElement(parent, f'{{{SVG_NS}}}{tag}', attrs or {})
              if value is not None:
                  item.text = str(value)
              return item

          card_width = 490
          rows = max(1, (len(top_languages) + 1) // 2)
          card_height = 91 + 26 * rows
          root = ET.Element(f'{{{SVG_NS}}}svg', {
              'width': str(card_width), 'height': str(card_height),
              'viewBox': f'0 0 {card_width} {card_height}',
              'role': 'img', 'aria-label': 'Most Used Languages',
          })
          element(root, 'rect', {
              'x': '0.5', 'y': '0.5', 'width': str(card_width-1),
              'height': str(card_height-1), 'rx': '6',
              'fill': '#ffffff', 'stroke': '#e5e7eb',
          })
          element(root, 'text', {
              'x': '18', 'y': '32', 'fill': '#4f86b1',
              'font-size': '19', 'font-weight': '600',
              'font-family': 'Arial, Helvetica, sans-serif',
          }, 'Most Used Languages')
          element(root, 'rect', {
              'x': '18', 'y': '49', 'width': str(card_width-36),
              'height': '9', 'rx': '4.5', 'fill': '#e6edf3',
          })
          if total_language_bytes:
              defs = element(root, 'defs')
              clip = element(defs, 'clipPath', {'id': 'bar-clip'})
              element(clip, 'rect', {
                  'x': '18', 'y': '49', 'width': str(card_width-36),
                  'height': '9', 'rx': '4.5',
              })
              segment_group = element(root, 'g', {'clip-path': 'url(#bar-clip)'})
              x = 18.0
              for name, byte_count in ranked_languages:
                  segment_width = (card_width - 36) * byte_count / total_language_bytes
                  element(segment_group, 'rect', {
                      'x': f'{x:.3f}', 'y': '49',
                      'width': f'{segment_width:.3f}', 'height': '9',
                      'fill': language_colors[name],
                  })
                  x += segment_width
          if not top_languages:
              element(root, 'text', {
                  'x': '18', 'y': '88', 'font-size': '13',
                  'fill': '#57606a',
              }, 'No public repository language data available.')
          for index, (name, byte_count) in enumerate(top_languages):
              column = index // rows
              row = index % rows
              x = 20 + column * 235
              y = 88 + row * 26
              percent = 100 * byte_count / total_language_bytes
              element(root, 'circle', {
                  'cx': str(x), 'cy': str(y-4), 'r': '4.5',
                  'fill': language_colors[name],
              })
              element(root, 'text', {
                  'x': str(x+12), 'y': str(y),
                  'fill': '#57606a', 'font-size': '12',
                  'font-family': 'Arial, Helvetica, sans-serif',
              }, f'{name} {percent:.1f}%')
          languages_path = Path('profile/languages.svg')
          languages_path.parent.mkdir(parents=True, exist_ok=True)
          languages_path.write_bytes(ET.tostring(root, encoding='utf-8', xml_declaration=True))

          readme = '''<h2 align="center">Hi there, I'm hyy321 👋</h2>

          ### 🎓 About Me

          I'm a graduate student at **Nanjing University of Information Science and Technology (NUIST)**, interested in **AI Agents, AI Systems, and AI Infrastructure**.

          ### 🚀 Tech Stack

          - 🔹 **Languages:**

            ![Python](https://img.shields.io/badge/Python-3776AB?style=flat&logo=python&logoColor=white)
            ![Go](https://img.shields.io/badge/Go-00ADD8?style=flat&logo=go&logoColor=white)
            ![TypeScript](https://img.shields.io/badge/TypeScript-3178C6?style=flat&logo=typescript&logoColor=white)
            ![JavaScript](https://img.shields.io/badge/JavaScript-F7DF1E?style=flat&logo=javascript&logoColor=black)
            ![Java](https://img.shields.io/badge/Java-ED8B00?style=flat&logo=openjdk&logoColor=white)

          - 🔹 **AI & Agents:**

            ![LangChain](https://img.shields.io/badge/LangChain-1C3C3C?style=flat)
            ![LangGraph](https://img.shields.io/badge/LangGraph-2C3E50?style=flat)
            ![MCP](https://img.shields.io/badge/MCP-654FF0?style=flat)
            ![Agent Skills](https://img.shields.io/badge/Agent_Skills-00897B?style=flat)
            ![Deep Research](https://img.shields.io/badge/Deep_Research-4169E1?style=flat)
            ![Multi-Agent](https://img.shields.io/badge/Multi--Agent-6A5ACD?style=flat)
            ![RAG](https://img.shields.io/badge/RAG-009688?style=flat)
            ![ReAct](https://img.shields.io/badge/ReAct-E67E22?style=flat)

          - 🔹 **Database:**

            ![MySQL](https://img.shields.io/badge/MySQL-4479A1?style=flat&logo=mysql&logoColor=white)
            ![Redis](https://img.shields.io/badge/Redis-DC382D?style=flat&logo=redis&logoColor=white)
            ![ChromaDB](https://img.shields.io/badge/ChromaDB-7952B3?style=flat)

          - 🔹 **Development Tools:**

            ![Git](https://img.shields.io/badge/Git-F05032?style=flat&logo=git&logoColor=white)
            ![VS Code](https://img.shields.io/badge/VS_Code-007ACC?style=flat)
            ![Codex](https://img.shields.io/badge/Codex-000000?style=flat&logo=openai&logoColor=white)
            ![Kubernetes](https://img.shields.io/badge/Kubernetes-326CE5?style=flat&logo=kubernetes&logoColor=white)
            ![Typora](https://img.shields.io/badge/Typora-525252?style=flat&logo=typora&logoColor=white)

          ### 📊 GitHub Activity

          <p align="center">
            <img src="./profile/streak.svg" alt="GitHub Streak" />
          </p>

          <p align="center">
            <img src="./profile/languages.svg" alt="Most Used Languages" />
          </p>
          '''
          # Strip YAML block indentation from the markdown payload.
          import textwrap
          Path('README.md').write_text(textwrap.dedent(readme).strip() + '\n', encoding='utf-8')
          print(f'Generated README and streak card for {year}; left total: {total}')
