
name: Generate Snake Animation

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/snake.yml"
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Generate snake SVG
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: hyy321
          outputs: |
            dist/github-snake.svg?palette=github-light&color_snake=#555555&color_dots=#e5e7eb,#d1d5db,#9ca3af,#6b7280,#374151
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#ffffff&color_dots=#2a303b,#475569,#64748b,#cbd5e1,#f8fafc

      - name: Publish snake animation
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
