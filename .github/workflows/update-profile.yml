name: Update GitHub Profile

on:
  push:
    paths:
      - '.github/workflows/update-profile.yml'
  schedule:
    - cron: '15 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate full-history streak card
        uses: DenverCoder1/github-readme-streak-stats@v1
        with:
          options: user=hyy321&theme=default&disable_animations=true
          path: profile/streak.svg

      - name: Fix this-year total and write full README
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          python3 - <<'PY'
          import datetime as dt
          import json
          import os
          import re
          import urllib.request
          from pathlib import Path

          user = 'hyy321'
          now = dt.datetime.now(dt.timezone.utc)
          year = now.year
          query = '''
          query($login: String!, $from: DateTime!, $to: DateTime!) {
            user(login: $login) {
              contributionsCollection(from: $from, to: $to) {
                contributionCalendar { totalContributions }
              }
            }
          }
          '''
          variables = {
              'login': user,
              'from': f'{year}-01-01T00:00:00Z',
              'to': now.strftime('%Y-%m-%dT%H:%M:%SZ'),
          }
          request = urllib.request.Request(
              'https://api.github.com/graphql',
              data=json.dumps({'query': query, 'variables': variables}).encode(),
              headers={
                  'Authorization': f'Bearer {os.environ["GH_TOKEN"]}',
                  'Accept': 'application/vnd.github+json',
                  'Content-Type': 'application/json',
                  'User-Agent': 'github-profile-streak',
              },
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              payload = json.load(response)
          if payload.get('errors') or not payload.get('data', {}).get('user'):
              raise RuntimeError(f'GitHub GraphQL error: {payload.get("errors", payload)}')
          total = payload['data']['user']['contributionsCollection']['contributionCalendar']['totalContributions']

          svg_path = Path('profile/streak.svg')
          svg = svg_path.read_text(encoding='utf-8')

          def replace_panel(comment, value):
              global svg
              pattern = r'(<!--\s*' + re.escape(comment) + r'\s*-->[\s\S]*?<text\b[^>]*>)([\s\S]*?)(</text>)'
              match = re.search(pattern, svg)
              if match is None or len(re.findall(pattern, svg)) != 1:
                  raise RuntimeError(f'Streak SVG layout changed: {comment}')
              svg = svg[:match.start(2)] + '\n' + str(value) + '\n' + svg[match.end(2):]

          # Only these TWO left-panel values are modified.
          replace_panel('Total Contributions big number', f'{total:,}')
          replace_panel('Total Contributions range', f'Jan 1, {year} - Present')
          svg_path.write_text(svg, encoding='utf-8')

          # Build a language card from publicly owned, non-fork repositories.
          from collections import defaultdict
          from xml.etree import ElementTree as ET

          language_sizes = defaultdict(int)
          language_colors = {}
          cursor = None
          language_query = """
          query($login: String!, $cursor: String) {
            user(login: $login) {
              repositories(
                first: 50, after: $cursor, isFork: false,
                ownerAffiliations: OWNER, privacy: PUBLIC
              ) {
                pageInfo { hasNextPage endCursor }
                nodes {
                  languages(first: 20, orderBy: { field: SIZE, direction: DESC }) {
                    edges { size node { name color } }
                  }
                }
              }
            }
          }
          """
          while True:
              language_request = urllib.request.Request(
                  'https://api.github.com/graphql',
                  data=json.dumps({
                      'query': language_query,
                      'variables': {'login': user, 'cursor': cursor},
                  }).encode(),
                  headers={
                      'Authorization': f'Bearer {os.environ["GH_TOKEN"]}',
                      'Accept': 'application/vnd.github+json',
                      'Content-Type': 'application/json',
                      'User-Agent': 'github-profile-languages',
                  },
              )
              with urllib.request.urlopen(language_request, timeout=30) as response:
                  language_payload = json.load(response)
